<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .header {
            background-color: #333;
            color: #ffffff;
            padding: 10px;
            text-align: center;
        }
        .content {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }
        .description {
            font-size: 20px;
            margin: 20px 0;
        }
        .start-button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lesson Planner App</h1>
    </div>
    <div class="content">
        <p class="description">Create comprehensive lesson plans tailored to your needs with just a few clicks.</p>
        <a href="/home" class="start-button">Start Now</a>
    </div>
</body>
</html>

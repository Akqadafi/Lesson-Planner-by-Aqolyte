<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worksheet draft · Aqolyte Lesson Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/builder.css') }}">
</head>
<body>
  <header><a href="/">AQOLYTE</a><nav><a href="/builder/">Lesson Planner</a></nav></header>
  <main class="worksheet-main">
    <p class="eyebrow">GENERATED WORKSHEET</p>
    <h1>Worksheet draft.</h1>
    <p class="intro">Review every question and answer before sharing this material with students.</p>

    <section class="panel worksheet-result">
      <div class="heading"><div><p class="eyebrow">CONTENT</p><h2>Questions and answer material</h2></div><span class="badge">Needs teacher review</span></div>
      <pre class="worksheet-output">{{ content }}</pre>
      <div class="actions worksheet-actions">
        <form method="post" action="{{ url_for('output') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button type="submit" name="download_word" value="true">Download Word</button></form>
        <form method="post" action="{{ url_for('output') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button type="submit" name="download_pdf" value="true">Download PDF</button></form>
        <a href="{{ url_for('worksheet') }}">Create another worksheet</a>
      </div>
    </section>
  </main>
</body>
</html>

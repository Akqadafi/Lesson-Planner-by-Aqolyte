<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson needs another attempt</title><link rel="stylesheet" href="{{ url_for('static',filename='css/builder.css') }}"></head><body><main><section class="panel"><h1>{{ 'PDF export is unavailable' if export_error else 'We couldn’t complete this draft' }}</h1><p role="alert">{{ message }}</p><div class="actions">{% if export_error %}<a href="{{ url_for('output') }}">Back to saved content and Word download</a>{% else %}<form method="post" action="{{ url_for('output') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button type="submit" name="generate" value="1">Retry generation</button></form>{% endif %}<a href="{{ url_for('home') }}">Return to lesson form</a>{% if previous %}<form method="post" action="{{ url_for('output') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button name="restore_previous" value="1">Restore previous lesson</button></form>{% endif %}<a href="{{ url_for('builder.index') }}">Open lesson studio</a></div></section></main></body></html>

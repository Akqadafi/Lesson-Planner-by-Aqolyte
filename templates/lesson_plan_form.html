<!DOCTYPE html>
<html>
<head>
    <title>Lesson Plan Generator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Lesson Plan Generator</h1>
    <form method="POST">
    <label for="prompt">Prompt:</label><br>
    <select id="prompt-selection" name="prompt">
        <option value="">--Select a prompt--</option>
        <option value="prompt_1">Prompt 1</option>
        <option value="prompt_2">Prompt 2</option>
    </select><br>

    <div id="prompt1-inputs" style="display:none;">
        <label for="lesson_type">Lesson Type:</label><br>
        <input type="text" id="lesson_type" name="lesson_type"><br>

        <label for="number_of_words">Number of Words:</label><br>
        <input type="number" id="number_of_words" name="number_of_words"><br>

        <label for="grade_level">Grade Level:</label><br>
        <input type="text" id="grade_level" name="grade_level"><br>

        <label for="number_of_students">Number of Students:</label><br>
        <input type="number" id="number_of_students" name="number_of_students"><br>

        <label for="culture_group">Culture Group:</label><br>
        <input type="text" id="culture_group" name="culture_group"><br>

        <label for="socioeconomic_level">Socioeconomic Level:</label><br>
        <input type="text" id="socioeconomic_level" name="socioeconomic_level"><br>

        <label for="experiential_type">Experiential Type:</label><br>
        <input type="text" id="experiential_type" name="experiential_type"><br>

        <label for="disabled">Disabled:</label><br>
        <input type="checkbox" id="disabled" name="disabled"><br>

        <label for="ell">ELL:</label><br>
        <input type="checkbox" id="ell" name="ell"><br>

        <label for="gifted">Gifted:</label><br>
        <input type="checkbox" id="gifted" name="gifted"><br>

        <label for="state">State:</label><br>
        <input type="text" id="state" name="state"><br>
    </div>

    <div id="prompt2-inputs" style="display:none;">
        <!-- Fields for Prompt 2 go here -->
        <!-- Since the inputs for Prompt 2 are the same as for Prompt 1, we don't need to duplicate them here. -->
    </div>

    <!-- Common fields for both prompts -->
    <label for="topic">Topic:</label><br>
    <input type="text" id="topic" name="topic"><br>

    <input type="submit" value="Submit">
    </form>

    <script>
    document.getElementById('prompt-selection').addEventListener('change', function() {
        if (this.value === 'prompt_1') {
            document.getElementById('prompt1-inputs').style.display = 'block';
            document.getElementById('prompt2-inputs').style.display = 'none';
        } else if (this.value === 'prompt_2') {
            document.getElementById('prompt1-inputs').style.display = 'none';
            document.getElementById('prompt2-inputs').style.display = 'block';
        } else {
            document.getElementById('prompt1-inputs').style.display = 'none';
            document.getElementById('prompt2-inputs').style.display = 'none';
        }
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Lesson Plan Generator</title>
</head>
<body>
    <h1>Lesson Plan Generator</h1>
    <form method="POST"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="topic">Topic:</label><br>
    <input type="hidden" name="prompt" value="{{ prompt }}">
    <input type="text" id="topic" name="topic"><br>

    <label for="lesson_type">Lesson Type:</label><br>
<select id="lesson_type" name="lesson_type">
    <option value="inquiry_based">Inquiry Based</option>
    <option value="direct_instruction">Direct Instruction</option>
    <option value="project_based">Project-Based</option>
    <option value="flipped_classroom">Flipped Classroom</option>
</select><br>

    <label for="model_type">Model Type:</label><br>
    <input type="text" id="model_type" name="model_type"><br>

    <label for="number_of_words">Number of Words:</label><br>
    <input type="number" id="number_of_words" name="number_of_words"><br>

    <label for="grade_level">Grade Level:</label><br>
    <input type="number" id="grade_level" name="grade_level" min="0" max="12"><br>

    <label for="number_of_students">Number of Students:</label><br>
    <input type="number" id="number_of_students" name="number_of_students"><br>

    <label for="culture_group">Culture Group:</label><br>
    <input type="checkbox" id="black" name="culture_group" value="Black">
    <label for="black">Black</label><br>
    <input type="checkbox" id="latino" name="culture_group" value="Latino">
    <label for="latino">Latino</label><br>
    <input type="checkbox" id="white" name="culture_group" value="White">
    <label for="white">White</label><br>
    <input type="checkbox" id="asian" name="culture_group" value="Asian">
    <label for="asian">Asian</label><br>
    <input type="checkbox" id="american_indian" name="culture_group" value="American Indian">
    <label for="american_indian">American Indian</label><br>

    <label for="socioeconomic_level">Socioeconomic Level:</label><br>
    <select id="socioeconomic_level" name="socioeconomic_level">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select><br>

    <label for="experiential_type">Experiential Type:</label><br>
    <input type="text" id="experiential_type" name="experiential_type"><br>

    <label for="disabled">Disabled:</label><br>
    <input type="checkbox" id="disabled" name="disabled" value="True">
    <label for="disabled">Yes</label><br>

    <label for="ell">ELL:</label><br>
    <input type="checkbox" id="ell" name="ell" value="True">
    <label for="ell">Yes</label><br>

    <label for="gifted">Gifted:</label><br>
    <input type="checkbox" id="gifted" name="gifted" value="True">
    <label for="gifted">Yes</label><br>

    <label for="state">State:</label><br>
<select id="state" name="state">
    <option value="Alabama">Alabama</option>
    <option value="Alaska">Alaska</option>
    <option value="Arizona">Arizona</option>
    <option value="Arkansas">Arkansas</option>
    <option value="California">California</option>
    <option value="Colorado">Colorado</option>
    <option value="Connecticut">Connecticut</option>
    <option value="Delaware">Delaware</option>
    <option value="Florida">Florida</option>
    <option value="Georgia">Georgia</option>
    <option value="Hawaii">Hawaii</option>
    <option value="Idaho">Idaho</option>
    <option value="Illinois">Illinois</option>
    <option value="Indiana">Indiana</option>
    <option value="Iowa">Iowa</option>
    <option value="Kansas">Kansas</option>
    <option value="Kentucky">Kentucky</option>
    <option value="Louisiana">Louisiana</option>
    <option value="Maine">Maine</option>
    <option value="Maryland">Maryland</option>
    <option value="Massachusetts">Massachusetts</option>
    <option value="Michigan">Michigan</option>
    <option value="Minnesota">Minnesota</option>
    <option value="Mississippi">Mississippi</option>
    <option value="Missouri">Missouri</option>
    <option value="Montana">Montana</option>
    <option value="Nebraska">Nebraska</option>
    <option value="Nevada">Nevada</option>
    <option value="New Hampshire">New Hampshire</option>
    <option value="New Jersey">New Jersey</option>
    <option value="New Mexico">New Mexico</option>
    <option value="New York">New York</option>
    <option value="North Carolina">North Carolina</option>
    <option value="North Dakota">North Dakota</option>
    <option value="Ohio">Ohio</option>
    <option value="Oklahoma">Oklahoma</option>
    <option value="Oregon">Oregon</option>
    <option value="Pennsylvania">Pennsylvania</option>
    <option value="Rhode Island">Rhode Island</option>
    <option value="South Carolina">South Carolina</option>
    <option value="South Dakota">South Dakota</option>
    <option value="Tennessee">Tennessee</option>
    <option value="Texas">Texas</option>
    <option value="Utah">Utah</option>
    <option value="Vermont">Vermont</option>
    <option value="Virginia">Virginia</option>
    <option value="Washington">Washington</option>
    <option value="West Virginia">West Virginia</option>
    <option value="Wisconsin">Wisconsin</option>
    <option value="Wyoming">Wyoming</option>
</select><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>
